<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Confecção — All for One</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
</head>
<body>
    <header class="app-header">
        <div class="container">
            <h1>🎯 Sistema de Confecção</h1>
            <p class="subtitle">Projeção consolidada — processamento em memória, nenhum dado é salvo</p>
        </div>
    </header>

    <main class="container">
        <!-- Upload -->
        <section class="card upload-section">
            <h2>📁 Arquivos de Entrada</h2>
            <div class="upload-grid">
                <div class="upload-item">
                    <label for="pedidos">Pedidos (.xlsx)</label>
                    <input type="file" id="pedidos" accept=".xlsx,.xls">
                </div>
                <div class="upload-item">
                    <label for="estoque">Estoque (.xlsx)</label>
                    <input type="file" id="estoque" accept=".xlsx,.xls">
                </div>
                <div class="upload-item">
                    <label for="projecao">Projeção (.xlsx) — opcional</label>
                    <input type="file" id="projecao" accept=".xlsx,.xls">
                </div>
            </div>
            <button id="btn-processar" class="btn-primary">Processar</button>
            <div id="status" class="status"></div>
        </section>

        <!-- KPIs -->
        <section id="kpis" class="kpi-grid" style="display:none;"></section>

        <!-- Tabs -->
        <section id="resultados" style="display:none;">
            <div class="tabs">
                <button class="tab active" data-tab="kanban">📋 Kanban</button>
                <button class="tab" data-tab="dashboards">📊 Dashboards</button>
                <button class="tab" data-tab="estoque">📦 Estoque</button>
            </div>

            <div id="tab-kanban" class="tab-content active">
                <div id="kanban-content"></div>
            </div>
            <div id="tab-dashboards" class="tab-content">
                <div id="dashboards-content"></div>
            </div>
            <div id="tab-estoque" class="tab-content">
                <div id="estoque-content"></div>
            </div>
        </section>
    </main>

    <footer class="app-footer">
        <div class="container">
            <p>Sistema de Confecção — Flask (produção) · Nenhum dado é persistido</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
